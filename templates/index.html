<!DOCTYPE html>
<html>
<head>
    <title>Симулятор продуктов</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        select, input, button { margin: 5px; padding: 8px; width: 100%; }
        .result { background: #f0f0f0; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Симулятор продуктов с ограниченным сроком годности</h1>

        <form id="simForm">
            <label>Продукт:</label>
            <select id="product">
                <option value="milk">Молоко</option>
                <option value="tomatoes">Помидоры</option>
            </select>

            <label>Распределение:</label>
            <select id="distribution">
                <option value="uniform">Равномерное</option>
                <option value="normal">Нормальное</option>
            </select>

            <label>Дней симуляции:</label>
            <input type="number" id="days" value="30" min="1" max="100">

            <button type="submit">Запустить</button>
        </form>

        <div id="result" class="result" style="display:none;"></div>
    </div>

    <script>
        document.getElementById('simForm').onsubmit = async (e) => {
            e.preventDefault();

            const product = document.getElementById('product').value;
            const dist = document.getElementById('distribution').value;
            const days = document.getElementById('days').value;

            const params = {
                days: parseInt(days),
                min_stock: 300,
                purchase_price: 220,
                sale_price: 295
            };

            const response = await fetch(`/simulate/${product}/${dist}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(params)
            });

            const data = await response.json();

            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <h3>Результаты</h3>
                <p>Выручка: ${data.total_revenue.toFixed(2)} руб</p>
                <p>Затраты: ${data.total_cost.toFixed(2)} руб</p>
                <p>Прибыль: ${data.profit.toFixed(2)} руб</p>
                <p>Потери: ${data.total_spoilage_kg.toFixed(2)} кг</p>
                <h4>Статистика
